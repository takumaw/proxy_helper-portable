name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Package release asset
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          mkdir -p dist/libexec dist/share/man/man8
          cp target/x86_64-unknown-linux-musl/release/proxy_helper_ng dist/libexec/proxy_helper
          cp man/proxy_helper.8 dist/share/man/man8/proxy_helper.8
          cd dist
          tar -czf ../proxy_helper-${VERSION}-linux-amd64.tar.gz libexec share
          cd ..

      - name: Extract Release Notes from HISTORY.md
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          awk -v ver="$VERSION" '/^## / { if (p) { exit }; if ($2 == ver) { p=1; next } } p' HISTORY.md > release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            proxy_helper-v*-linux-amd64.tar.gz
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

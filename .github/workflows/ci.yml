name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (musl-tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check code formatting
        run: cargo fmt --check

      - name: Run clippy linter
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit tests
        run: cargo test

      - name: Build Release Binary
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Prepare Artifact Directory
        run: |
          mkdir -p dist/libexec dist/share/man/man8
          cp target/x86_64-unknown-linux-musl/release/proxy_helper_ng dist/libexec/proxy_helper
          cp man/proxy_helper.8 dist/share/man/man8/proxy_helper.8

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: proxy-helper-ci
          path: dist/
          if-no-files-found: error
